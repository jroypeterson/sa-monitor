name: halt-monitor — AM session

# AM session covers ~09:25 ET (EDT) or ~08:25 ET (EST) through 15:00 ET (EDT)
# or 14:00 ET (EST). Cron is in UTC and not DST-aware, so 13:25 UTC drifts by
# one hour vs ET twice a year. Pre-open buffer absorbs the EST early-start.
#
# The session END is wall-clock (19:00 UTC), not "20,100s from launch"
# (2026-07-28). GitHub delivers free-tier crons up to ~2h late; the old
# duration-from-launch model let a late AM run hold the shared
# `halt-monitor-session` concurrency group until 21:00 UTC — right through the
# 16:00 ET close the PM session exists to watch. Clamping to a wall-clock end
# means a late AM run is SHORTENED, and the group is always free by 19:00 UTC.
# 20,100s = 5h35m is now the cap (the on-time length), not the guarantee.
# See scripts/session_window.py.
#
# State persistence: scripts/ci_run.sh commits state/dedup_state_<YYYY-MM-DD>.json
# back to the repo at end of run so PM session reads the latest state.

on:
  schedule:
    - cron: '25 13 * * 1-5'  # 13:25 UTC weekdays
  workflow_dispatch:
    inputs:
      duration:
        description: 'Max run duration in seconds. Default 20100 (5h35m full session). Use a small value (e.g. 60) for a smoke test.'
        required: false
        default: '20100'
        type: string
      ignore_window:
        description: 'Ignore the 19:00 UTC wall-clock session end (needed to smoke-test outside the AM window).'
        required: false
        default: false
        type: boolean

# Prevent overlap if a prior AM run ran long.
concurrency:
  group: halt-monitor-session
  cancel-in-progress: false

permissions:
  contents: write  # for state-commit-back

jobs:
  am-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5h50m hard cap (vs 5h35m ci_run duration)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history for clean rebases on state-commit-back

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run halt monitor (AM session)
        env:
          SLACK_WEBHOOK_STREET_ACCOUNT: ${{ secrets.SLACK_WEBHOOK_STREET_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DURATION: ${{ inputs.duration || '20100' }}
          IGNORE_SESSION_WINDOW: ${{ inputs.ignore_window && '1' || '0' }}
        run: bash scripts/ci_run.sh am "$DURATION" 19:00

      - name: Upload event log artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: halt-monitor-am-log-${{ github.run_id }}
          path: logs/
          retention-days: 30
