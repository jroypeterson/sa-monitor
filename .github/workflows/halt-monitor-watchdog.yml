name: halt-monitor — Watchdog

# Hourly during weekday market window. If either AM or PM session hasn't fired
# today (cron events on GitHub Actions are best-effort and can be silently
# dropped during high load), recover by triggering it via gh workflow run.
#
# Two hardening changes (2026-06-15, fixes the recurring PM "failures"):
#   1) Grace window. GitHub routinely DELIVERS scheduled crons late under load —
#      the PM cron (19:05 UTC) often slips to ~21:00. The old logic checked the
#      instant NOW >= scheduled time, saw no run yet, and fired a redundant
#      workflow_dispatch that then COLLIDED with the late scheduled run in the
#      `halt-monitor-session` concurrency group — one of the pair ended up
#      `cancelled` every single PM day, which the fleet digest counted as a
#      failure (the "4 of 9 failed" report). We now only recover well PAST the
#      scheduled time, by which point a merely-delayed run has appeared.
#   2) Healthy-run coverage. A session counts as covered only if a run is still
#      queued/in_progress OR finished `success`. A `failure`/`cancelled` run no
#      longer counts as coverage, so a fire-then-fail run triggers recovery
#      instead of silently masking it.
#
# Mirrors the sigma-alert/.github/workflows/sigma-watchdog.yml pattern.

on:
  schedule:
    # Every hour 14:00–23:00 UTC weekdays. Extended past 21:00 so the post-grace
    # PM recovery check (>= 22:00 UTC) has ticks to run on.
    - cron: '0 14-23 * * 1-5'
  workflow_dispatch:
    inputs:
      test_heartbeat:
        description: 'Force a Slack heartbeat post (for verifying webhook plumbing)'
        type: boolean
        default: false

permissions:
  actions: write   # for gh workflow run
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check for missed sessions and recover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SLACK_WEBHOOK_STREET_ACCOUNT: ${{ secrets.SLACK_WEBHOOK_STREET_ACCOUNT }}
          TEST_HEARTBEAT: ${{ github.event.inputs.test_heartbeat }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          NOW_HHMM=$(date -u +%H%M)

          recovered=()

          check_session() {
            local workflow_name="$1"
            local recover_after_hhmm="$2"  # scheduled time + grace for GitHub's cron-delivery lag

            if [ "$NOW_HHMM" -lt "$recover_after_hhmm" ]; then
              echo "[$workflow_name] within grace window (recover after $recover_after_hhmm UTC, now $NOW_HHMM UTC)"
              return
            fi

            # A run "covers" the session only if it is healthy: still queued or
            # in_progress, or it finished `success`. A failure/cancelled run does
            # NOT count — otherwise a fire-then-fail run silently masks recovery.
            local healthy
            healthy=$(gh run list \
              --workflow "$workflow_name" \
              --created "$TODAY" \
              --limit 50 \
              --json status,conclusion \
              --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .conclusion=="success")] | length')

            if [ "$healthy" -gt 0 ]; then
              echo "[$workflow_name] OK — $healthy healthy run(s) today"
              return
            fi

            echo "[$workflow_name] MISSING or all-runs-failed — triggering manual run"
            gh workflow run "$workflow_name"
            recovered+=("$workflow_name")
          }

          # Recover-after = scheduled time + grace. AM cron 13:25 → 15:30 (2h grace);
          # PM cron 19:05 → 22:00 (absorbs the observed ~2h PM delivery slip, so the
          # late-but-fine scheduled run lands and counts before we'd ever dispatch).
          check_session "halt-monitor — AM session" "1530"
          check_session "halt-monitor — PM session" "2200"

          # Test mode — force a heartbeat to validate the Slack webhook path on demand.
          if [ "${TEST_HEARTBEAT:-false}" = "true" ] && [ "${#recovered[@]}" -eq 0 ]; then
            recovered+=("(test heartbeat — no real recovery)")
          fi

          # Slack heartbeat ONLY when we had to recover something — silent on healthy days.
          if [ "${#recovered[@]}" -gt 0 ]; then
            list=$(printf '• %s\n' "${recovered[@]}")
            payload=$(jq -n \
              --arg text "$(printf ':rotating_light: *halt-monitor watchdog* recovered missed run(s) on %s:\n%s' "$TODAY" "$list")" \
              '{text: $text, blocks: [{type:"section",text:{type:"mrkdwn",text:$text}}]}')

            # Diagnostic: byte counts only (the secret itself is masked by GH).
            raw_len=$(printf '%s' "$SLACK_WEBHOOK_STREET_ACCOUNT" | wc -c)
            echo "[debug] webhook secret raw byte length: $raw_len"

            # Extract the URL robustly — anchor on https:// and take until first
            # whitespace. This survives leading garbage (BOM, stray quotes, etc.)
            # and trailing newlines that earlier tr -d '[:space:]' didn't catch.
            webhook_url=$(printf '%s' "$SLACK_WEBHOOK_STREET_ACCOUNT" | grep -oE 'https?://[^[:space:]"]+' | head -1)
            url_len=$(printf '%s' "$webhook_url" | wc -c)
            echo "[debug] extracted webhook url byte length: $url_len"

            if [ -z "$webhook_url" ]; then
              echo "[WARN] Could not extract a valid http(s) URL from SLACK_WEBHOOK_STREET_ACCOUNT — skipping heartbeat"
            else
              curl -sS -X POST -H 'Content-Type: application/json' \
                --data "$payload" "$webhook_url" > /dev/null || \
                echo "[WARN] Failed to post watchdog Slack heartbeat"
            fi
          fi
